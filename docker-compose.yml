services:
  datagouv-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: datagouv-mcp:latest
    ports:
      - "${MCP_PORT:-8000}:${MCP_PORT:-8000}"
    environment:
      - MCP_HOST=${MCP_HOST:-0.0.0.0}
      - MCP_PORT=${MCP_PORT:-8000}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS}
      - DATAGOUV_API_ENV=${DATAGOUV_API_ENV:-prod}
      - UDATA_API_URL=${UDATA_API_URL}
      - UDATA_SITE_URL=${UDATA_SITE_URL}
      - UDATA_PORTAL_NAME=${UDATA_PORTAL_NAME}
      - UDATA_LANGUAGE=${UDATA_LANGUAGE}
      - TABULAR_API_URL=${TABULAR_API_URL}
      - METRICS_API_URL=${METRICS_API_URL}
      - CRAWLER_API_URL=${CRAWLER_API_URL}
      - LOCAL_QUERY_MAX_BYTES=${LOCAL_QUERY_MAX_BYTES}
      - LOCAL_QUERY_CACHE_DIR=${LOCAL_QUERY_CACHE_DIR}
      - LOCAL_QUERY_CACHE_MAX_BYTES=${LOCAL_QUERY_CACHE_MAX_BYTES}
      - LOCAL_QUERY_CACHE_REVALIDATE_SECONDS=${LOCAL_QUERY_CACHE_REVALIDATE_SECONDS}
      - MATOMO_URL=${MATOMO_URL}
      - MATOMO_SITE_ID=${MATOMO_SITE_ID}
      - MATOMO_AUTH_TOKEN=${MATOMO_AUTH_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; port = os.getenv('MCP_PORT', '8000'); urllib.request.urlopen(f'http://localhost:{port}/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
