version: 2.1

parameters:
  python-version:
    type: string
    default: "3.14"
  container-registry-namespace:
    type: string
    default: "datagouv_datagouv-mcp"
  docker-image:
    type: string
    default: "datagouv-mcp"

jobs:
  lint:
    docker:
      - image: ghcr.io/astral-sh/uv:python<< pipeline.parameters.python-version >>-trixie
    steps:
      - checkout
      - run:
          name: Install dependencies and dev dependencies
          command: uv sync --frozen
      - run:
          name: Lint and format code and sort imports
          # ruff check . : check linting without fixing (to fix, use --fix)
          # ruff format --check . : check code formatting without fixing (to fix, remove --check)
          command: |
            uv run ruff check .
            uv run ruff format --check .
      - run:
          name: Type check
          command: uv run ty check

  test:
    docker:
      - image: ghcr.io/astral-sh/uv:python<< pipeline.parameters.python-version >>-trixie
    steps:
      - checkout
      - run:
          name: Install dependencies and dev dependencies
          command: uv sync --frozen
      - run:
          name: Run tests
          command: |
            mkdir -p test-results
            uv run pytest -v --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results

  build:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Set image version
          command: echo "version=${CIRCLE_SHA1:0:7}" >> "$BASH_ENV"
      - run:
          name: Log in to container registry
          command: |
            : "${CONTAINER_REGISTRY_SERVER:?missing CONTAINER_REGISTRY_SERVER}"
            : "${CONTAINER_REGISTRY_USERNAME:?missing CONTAINER_REGISTRY_USERNAME}"
            : "${CONTAINER_REGISTRY_PASSWORD:?missing CONTAINER_REGISTRY_PASSWORD}"
            echo "${CONTAINER_REGISTRY_PASSWORD}" | docker login \
              -u "${CONTAINER_REGISTRY_USERNAME}" \
              --password-stdin "${CONTAINER_REGISTRY_SERVER}"
      - run:
          name: Build and push
          command: |
            source "$BASH_ENV"
            : "${CONTAINER_REGISTRY_SERVER:?missing CONTAINER_REGISTRY_SERVER}"
            git fetch --tags --force origin
            REPO="${CONTAINER_REGISTRY_SERVER}/<< pipeline.parameters.container-registry-namespace >>/<< pipeline.parameters.docker-image >>"
            DOCKER_TAG_GIT="${CIRCLE_TAG:-$(git describe --tags --exact-match 2>/dev/null || true)}"
            docker build \
              -t "${REPO}:${version}" \
              $([ "${CIRCLE_BRANCH:-}" = "main" ] && echo -t "${REPO}:latest") \
              ${DOCKER_TAG_GIT:+-t "${REPO}:${DOCKER_TAG_GIT}"} \
              .
            docker push "${REPO}:${version}"
            if [ "${CIRCLE_BRANCH:-}" = "main" ]; then
              docker push "${REPO}:latest"
            fi
            if [ -n "$DOCKER_TAG_GIT" ]; then
              docker push "${REPO}:${DOCKER_TAG_GIT}"
            fi

workflows:
  lint-test-build:
    jobs:
      # Tag filters must be on every job in the chain, or tag pipelines skip dependents.
      - lint:
          filters:
            tags:
              only: /^v.+/
      - test:
          filters:
            tags:
              only: /^v.+/
      - build:
          requires:
            - lint
            - test
          filters:
            tags:
              only: /^v.+/
          context: org-global
